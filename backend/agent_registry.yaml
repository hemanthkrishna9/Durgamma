---
# Agent Registry — All possible agent roles for Mission Control
# The Mission Analyzer selects from this based on the customer's goal.

roles:
  orchestrator:
    display_name: "Orchestrator"
    category: "core"
    authority_level: 100
    domain: "process"
    description: "Lead coordinator. Delegates, monitors, unblocks, escalates."
    always_spawn: true
    model: "claude-sonnet-4-20250514"
    names: ["Orca", "Nova", "Sage"]
    tools:
      - shell
      - file
      - git
      - task_board
      - agent_messaging
    spawn_conditions:
      - "always"

  architect:
    display_name: "Architect"
    category: "software_development"
    authority_level: 90
    domain: "architecture"
    description: "System design, tech stack, API contracts, DB schema."
    always_spawn: false
    model: "claude-sonnet-4-20250514"
    names: ["Archie", "Athena", "Blueprint"]
    tools:
      - shell
      - file
      - git
      - browser
    spawn_conditions:
      - "mission_requires_software"
      - "mission_requires_system_design"

  backend-dev:
    display_name: "Backend Developer"
    category: "software_development"
    authority_level: 50
